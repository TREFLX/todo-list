<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app__title">Мои задачи</h1>

      <form class="app__form" id="task-form">
        <input
          type="text"
          class="app__input"
          id="task-input"
          placeholder="Что нужно сделать?"
          autocomplete="off"
          required
        />
        <button type="submit" class="app__add-btn">Добавить</button>
      </form>
      <div class="app__filters" id="filters">
        <button class="app__filter app__filter--active" data-filter="all">
          Все
        </button>
        <button class="app__filter" data-filter="active">Активные</button>
        <button class="app__filter" data-filter="done">Выполненые</button>
      </div>
      <ul class="app__list" id="task-list"></ul>
      <footer class="app__footer">
        <span class="app__counter" id="counter">0 Задач</span>
      </footer>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
